<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - Video Deliverables</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-slate-950 border-r border-slate-800 hidden md:flex flex-col justify-between p-5">
        <div class="space-y-6">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold"><i class="fa-solid fa-bolt"></i></div>
                <div>
                    <h2 class="font-bold text-sm text-white">Client Portal</h2>
                    <p class="text-[10px] text-slate-400">Aussie Media Operations</p>
                </div>
            </div>
            <nav class="space-y-1 text-xs">
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-white transition"><i class="fa-solid fa-house w-4"></i> Dashboard</a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-600/10 text-blue-400 border border-blue-500/20 font-semibold"><i class="fa-solid fa-clapperboard w-4"></i> Video Deliverables</a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-white transition"><i class="fa-solid fa-file-invoice w-4"></i> Documents & Files</a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-white transition"><i class="fa-solid fa-headset w-4"></i> Support & Comms</a>
            </nav>
        </div>
        <div class="border-t border-slate-800 pt-4 text-xs text-slate-500">
            <p class="font-medium text-slate-400">Logged in client</p>
            <p class="text-[11px] truncate">client@aussieaccount.com.au</p>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 md:p-8 space-y-6 overflow-y-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-5">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-clapperboard text-blue-500"></i> Video Assets & Feedback Approvals
                </h1>
                <p class="text-xs text-slate-400 mt-1">Review, approve, or request revisions for ongoing video deliverables.</p>
            </div>
            <button onclick="addNewVideo()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-plus"></i> Add Video Asset
            </button>
        </div>

        <!-- Videos Grid Container -->
        <div id="videos-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Dynamic Video Cards will be inserted here -->
        </div>
    </main>

    <!-- Custom Modal for Revision / Notes (English & Professional) -->
    <div id="feedback-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-950 border border-slate-800 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="font-semibold text-white text-sm flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-blue-500"></i> Request Revision / Update Notes
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-medium">Provide your feedback or instructions for this video asset:</label>
                <textarea id="modal-textarea" rows="4" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 focus:outline-none focus:border-blue-500 placeholder-slate-600" placeholder="e.g., Please check hook timing and brighten the lighting at 0:03."></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded text-xs font-semibold transition">Cancel</button>
                <button id="modal-submit-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-xs font-semibold transition">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Implementation -->
    <script>
        // Mock Data Storage
        let appData = {
            videos: [
                {
                    file: "Reel_12_Bondi.mp4",
                    title: "Reel #12 - Bondi Beach Lifestyle Promo (v2)",
                    status: "Revision Requested",
                    notes: "Please check hook timing and brighten the lighting at 0:03.",
                    timestamp: "Aug 26, 2026, 04:45 PM"
                },
                {
                    file: "UGC_Sydney.mp4",
                    title: "Client UGC Testimonial - Sydney CBD Shoot",
                    status: "Approved ✓",
                    notes: "Approved for paid ad scaling.",
                    timestamp: "Aug 25, 2026, 01:20 PM"
                }
            ]
        };

        let activeVideoIndex = null;

        // Render Videos Function
        function renderVideos() {
            const container = document.getElementById('videos-container');
            container.innerHTML = '';
            
            appData.videos.forEach((v, idx) => {
                let badgeColor = v.status.includes('Approved') 
                    ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/25' 
                    : 'text-amber-400 bg-amber-500/10 border-amber-500/25';
                
                container.innerHTML += `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 space-y-4 flex flex-col justify-between shadow-lg">
                        <div>
                            <div class="bg-slate-900 rounded-lg h-36 flex items-center justify-center border border-slate-800 relative mb-3">
                                <i class="fa-solid fa-play text-3xl text-blue-500"></i>
                                <span class="absolute top-3 left-3 text-xs bg-black/60 px-2 py-1 rounded text-slate-300 font-mono">${v.file}</span>
                                <span class="absolute top-3 right-3 text-xs px-2 py-1 rounded border ${badgeColor}">${v.status}</span>
                            </div>
                            <h3 class="font-semibold text-white text-sm">${v.title}</h3>
                            <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800 text-xs text-slate-300 mt-2">
                                <span class="text-blue-400 font-semibold">Notes / Feedback:</span> 
                                <p class="mt-0.5 italic text-slate-400">${v.notes || 'No notes yet. Click request revision to add comments.'}</p>
                            </div>
                            <p class="text-[11px] font-mono text-slate-500 mt-2"><i class="fa-regular fa-clock mr-1"></i> Logged: ${v.timestamp}</p>
                        </div>
                        <div class="flex gap-2 pt-2 border-t border-slate-800">
                            <button onclick="updateVideoStatus(${idx}, 'Approved ✓')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded text-xs font-semibold transition">Approve</button>
                            <button onclick="openModal(${idx}, 'revision')" class="flex-1 bg-amber-600/80 hover:bg-amber-600 text-white py-2 rounded text-xs font-semibold transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-rotate-left"></i> Request Revision
                            </button>
                            <button onclick="openModal(${idx}, 'edit')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded text-xs font-semibold transition" title="Edit Notes">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // Quick Approve Status Update
        function updateVideoStatus(index, status) {
            appData.videos[index].status = status;
            appData.videos[index].timestamp = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            renderVideos();
        }

        // Open Custom Modal
        function openModal(index, mode) {
            activeVideoIndex = index;
            const modal = document.getElementById('feedback-modal');
            const textarea = document.getElementById('modal-textarea');
            const modalTitle = document.getElementById('modal-title');
            const submitBtn = document.getElementById('modal-submit-btn');

            textarea.value = appData.videos[index].notes || '';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            if (mode === 'revision') {
                modalTitle.innerHTML = `<i class="fa-solid fa-rotate-left text-amber-500"></i> Request Video Revision`;
                submitBtn.className = "bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded text-xs font-semibold transition";
                submitBtn.innerText = "Submit Revision Request";
                submitBtn.onclick = submitRevision;
            } else {
                modalTitle.innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-500"></i> Edit Feedback Notes`;
                submitBtn.className = "bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-xs font-semibold transition";
                submitBtn.innerText = "Save Notes";
                submitBtn.onclick = submitEditNotes;
            }
        }

        // Close Modal
        function closeModal() {
            document.getElementById('feedback-modal').classList.add('hidden');
            document.getElementById('feedback-modal').classList.remove('flex');
            activeVideoIndex = null;
        }

        // Submit Revision Request Action
        function submitRevision() {
            let feedback = document.getElementById('modal-textarea').value.trim();
            if (activeVideoIndex !== null && feedback !== "") {
                appData.videos[activeVideoIndex].notes = feedback;
                appData.videos[activeVideoIndex].status = "Revision Requested";
                appData.videos[activeVideoIndex].timestamp = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                renderVideos();
                closeModal();
            } else {
                alert("Please enter revision instructions.");
            }
        }

        // Submit Edited Notes Action
        function submitEditNotes() {
            let feedback = document.getElementById('modal-textarea').value.trim();
            if (activeVideoIndex !== null) {
                appData.videos[activeVideoIndex].notes = feedback;
                renderVideos();
                closeModal();
            }
        }

        // Helper to add dummy test video
        function addNewVideo() {
            let title = prompt("Enter Video Title (e.g., Reel #13):");
            if(title) {
                appData.videos.push({
                    file: "New_Upload.mp4",
                    title: title,
                    status: "Pending Review",
                    notes: "Newly uploaded asset.",
                    timestamp: new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' })
                });
                renderVideos();
            }
        }

        // Initial Load
        renderVideos();
    </script>
</body>
</html>
