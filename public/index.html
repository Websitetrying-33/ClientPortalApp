<!-- MODAL POPUP HTML (Idagdag ito sa pinakadulo ng <body> ng index.html mo) -->
<div id="contractModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center border-b pb-3 mb-4">
            <h3 id="modalTitle" class="text-lg font-bold text-gray-900">Contract Title</h3>
            <button onclick="closeContractModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
        </div>
        <div id="modalBody" class="overflow-y-auto flex-grow text-sm text-gray-700 space-y-4 pr-2 bg-gray-50 p-4 rounded-lg border">
            <!-- Dito papasok ang buong teksto ng kontrata -->
        </div>
        <div class="border-t pt-4 mt-4 flex justify-end space-x-3">
            <a id="downloadBtn" href="#" target="_blank" class="px-4 py-2 bg-green-600 text-white text-sm font-medium rounded-md hover:bg-green-700 transition">
                Download PDF Copy
            </a>
            <button onclick="closeContractModal()" class="px-4 py-2 bg-gray-300 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-400 transition">
                Close
            </button>
        </div>
    </div>
</div>
